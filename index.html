
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earth 3D - 지구 모델링</title>

    <!-- CSS 파일 연결하기 -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div id="container">
        <!-- 제목표시하기 -->
        <header>
            <h1>Earth 3D</h1>
            <p>3D 지구 모델링 및 고도 시각화</p>
        </header>

        <!-- 지구를 표시할 영역 설정하기 -->
        <div id="earth-container"></div>

        <!-- 사용자 조작 영역 설정하기 -->

        <div id="controls">
            <button id="rotation-btn">회전 정지</button>

            <div class="control-row">
                <label for="rotation-speed">회전 속도</label>
                <input type="range" id="rotation-speed"
                       min="0" max="5" step="0.1" value="1">
            </div>

            <div class="control-row">
                <label for="height-scale">고도 강조</label>
                <input type="range" id="height-scale"
                       min="0" max="5" step="0.1" value="1">
           </div>
        </div>

    <!-- Three.js 라이브러리에 연결하는 코드 기입하기 -->
    <script type="module" src="./main.js"></script>

</body>
</html>
